name: build

on:
  repository_dispatch:
    types: [build-on-demand]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZeroTierFix
        uses: actions/checkout@v7
        with:
          # The core has been modified in this repo so it's not working with official cores.
          # repository: "wongsyrone/ZerotierFix"
          repository: "kaaass/ZerotierFix"
          path: "ZerotierFix"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: "ZeroTierFix-Build"
      - name: Do something
        run: |
          export version=$(curl "https://api.github.com/repos/zerotier/ZeroTierOne/releases/latest" | jq -r '.name')
          export ver=${version//./}
          echo "corever=$ver" >> $GITHUB_ENV
          cd ZerotierFix/app
          sed -r -i "s/versionName \"(.*?)\"/versionName \"\1_$ver\"/g" build.gradle
          cd ..
          rm -rf externals
          mkdir externals
      - name: Checkout ZeroTierOne
        uses: actions/checkout@v7
        with:
          repository: "zerotier/ZeroTierOne"
          path: "ZerotierFix/externals/core"
          ref: "dev"
      - name: Do something else
        run: |
          cd ZerotierFix/externals/core/java
          rm CMakeLists.txt
          cp ../../../../ZeroTierFix-Build/CMakeLists.txt .
          cd ../../../../
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build APK
        run: |
          cd ZerotierFix
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/*.apk ../ZerotierFix-${{ env.corever }}.apk
          cd ..
      - name: Sign APK
        id: sign_app
        uses: noriban/sign-android-release@v5
        with:
          releaseDirectory: .
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
      - name: Upload apk
        uses: actions/upload-artifact@v7
        with:
          name: ZerotierFix-${{ env.corever }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
